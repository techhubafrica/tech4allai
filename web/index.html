<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tech4All AI Tools Platform - Your intelligent companion for everyday tasks.">

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="Tech4All AI">
  <meta property="og:description" content="Tech4All AI Tools Platform - Your intelligent companion for everyday tasks.">
  <meta property="og:image" content="https://tech4all-ai.techhubafrica.org/icons/Icon-512.png">
  <meta property="og:url" content="https://tech4all-ai.techhubafrica.org/">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tech4All">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Tech4All</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0e0a08;
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0e0a08;
      transition: opacity 250ms ease;
    }

    #app-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 6px solid rgba(255, 111, 0, 0.12);
      border-top-color: #ff6f00;
      border-radius: 50%;
      animation: spin 950ms linear infinite;
    }

    .loading-text {
      margin-top: 28px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 0.8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="app-loader">
    <div class="spinner"></div>
    <div class="loading-text">Loading Tech4All AI...</div>
  </div>

  <script>
    window.flutterConfiguration = {
      canvasKitBaseUrl: "https://unpkg.com/canvaskit-wasm@0.39.1/bin/",
    };
  </script>

  <script src="https://core.rushpay.cash/widget/payment-widget-v2.js"></script>
  <script>
    function openRushPayCheckout(paymentReference, widgetSessionToken, callbackUrl) {
      console.log('Initializing RushPay V2 checkout widget for ref:', paymentReference);
      
      let overlay = document.getElementById('rushpay-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'rushpay-overlay';
        overlay.style.position = 'fixed';
        overlay.style.inset = '0';
        overlay.style.backgroundColor = 'rgba(0,0,0,0.85)';
        overlay.style.zIndex = '9999999';
        overlay.style.display = 'flex';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.backdropFilter = 'blur(8px)';
        
        const container = document.createElement('div');
        container.id = 'rushpay-widget-container';
        container.style.width = '90%';
        container.style.maxWidth = '450px';
        container.style.height = '90%';
        container.style.maxHeight = '700px';
        container.style.backgroundColor = '#18120e';
        container.style.borderRadius = '24px';
        container.style.overflowY = 'auto';
        container.style.position = 'relative';
        container.style.border = '1px solid #2d241d';
        container.style.boxShadow = '0 24px 48px rgba(0,0,0,0.8)';
        container.style.padding = '12px';
        
        // Add close button
        const closeBtn = document.createElement('button');
        closeBtn.innerHTML = '✕';
        closeBtn.style.position = 'absolute';
        closeBtn.style.top = '16px';
        closeBtn.style.right = '16px';
        closeBtn.style.background = '#2d241d';
        closeBtn.style.border = 'none';
        closeBtn.style.borderRadius = '50%';
        closeBtn.style.color = '#fff';
        closeBtn.style.width = '32px';
        closeBtn.style.height = '32px';
        closeBtn.style.fontSize = '14px';
        closeBtn.style.cursor = 'pointer';
        closeBtn.style.zIndex = '10000';
        closeBtn.style.display = 'flex';
        closeBtn.style.alignItems = 'center';
        closeBtn.style.justifyContent = 'center';
        closeBtn.style.transition = 'background 200ms';
        closeBtn.onmouseover = () => { closeBtn.style.background = '#ff6f00'; };
        closeBtn.onmouseout = () => { closeBtn.style.background = '#2d241d'; };
        closeBtn.onclick = () => {
          overlay.remove();
        };
        
        const widgetTarget = document.createElement('div');
        widgetTarget.id = 'rushpay-widget-target';
        widgetTarget.style.width = '100%';
        widgetTarget.style.height = '100%';
        
        container.appendChild(closeBtn);
        container.appendChild(widgetTarget);
        overlay.appendChild(container);
        document.body.appendChild(overlay);
      }
      
      if (window.RushPayV2) {
        window.RushPayV2.init({
          containerId: 'rushpay-widget-target',
          paymentReference: paymentReference,
          widgetSessionToken: widgetSessionToken,
          callbackUrl: callbackUrl,
          apiBase: "https://core.rushpay.cash"
        });

        // Listen for completion postMessage from RushPay
        window.addEventListener('message', function onRushPayMsg(event) {
          if (event.data && (
            event.data.status === 'completed' || 
            event.data.status === 'paid' || 
            event.data.event === 'payment_success' ||
            event.data.type === 'rushpay:completed'
          )) {
            const overlay = document.getElementById('rushpay-overlay');
            if (overlay) overlay.remove();
          }
        });
      } else {
        console.error("RushPayV2 is not loaded on window.");
        alert("Failed to load RushPay payment gateway. Please check your internet connection.");
      }
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>

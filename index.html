<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tech4All AI Tools Platform - Your intelligent companion for everyday tasks.">

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="Tech4All AI">
  <meta property="og:description" content="Tech4All AI Tools Platform - Your intelligent companion for everyday tasks.">
  <meta property="og:image" content="https://tech4all-ai.techhubafrica.org/icons/Icon-512.png">
  <meta property="og:url" content="https://tech4all-ai.techhubafrica.org/">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tech4All">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Tech4All</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0e0a08;
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0e0a08;
      transition: opacity 250ms ease;
    }

    #app-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 6px solid rgba(255, 111, 0, 0.12);
      border-top-color: #ff6f00;
      border-radius: 50%;
      animation: spin 950ms linear infinite;
    }

    .loading-text {
      margin-top: 28px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 0.8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="app-loader">
    <div class="spinner"></div>
    <div class="loading-text">Loading Tech4All AI...</div>
  </div>

  <script>
    window.flutterConfiguration = {
      canvasKitBaseUrl: "https://unpkg.com/canvaskit-wasm@0.39.1/bin/",
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
